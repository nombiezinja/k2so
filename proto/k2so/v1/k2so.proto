syntax = "proto3";

package k2so.v1;

option go_package = "github.com/nombiezinja/k2so/proto/k2so/v1;v1";

import "google/protobuf/timestamp.proto";

service K2SO {
  rpc Run(RunRequest) returns (RunResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Logs(LogsRequest) returns (stream LogsResponse);
}

message RunRequest {
  // binary is the absolute path to executable (validated: exists, executable)
  string binary = 1;
  // args contains command arguments (max 64 args, 4KB per arg, no shell interpretation).
  repeated string args = 2;
}

message RunResponse {
  // job_id is a uuid generated with crypto/rand server side
  string job_id = 1;
  // TODO: add structured error details for validation errors, resource limits
  // Errors communicated via gRPC status codes:
  // - INVALID_ARGUMENT: bad binary path, invalid args
  // - RESOURCE_EXHAUSTED: job limits exceeded, output size caps breached
  // - PERMISSION_DENIED: not authorized for 'run' action
  // - UNAVAILABLE: server overloaded or shutting down
  // - INTERNAL: unexpected server error
}

message StopRequest {
  string job_id = 1;
  // force_kill skips graceful SIGTERM and sends SIGKILL immediately
  bool force_kill = 2;
}

message StopResponse {
  // Errors communicated via gRPC status codes:
  // - NOT_FOUND: job ID does not exist
  // - PERMISSION_DENIED: job not owned by requesting principal
  // - UNAVAILABLE: server overloaded or shutting down
  // - INTERNAL: unexpected server error
  // Success: job enters TERMINATING state, then transitions to CANCELLED
}

message DescribeRequest {
  string job_id = 1;
}

message DescribeResponse {
  // job_id is the unique identifier for the job.
  string job_id = 1;
  // status is the current job execution state.
  JobStatus status = 2;
  // pid is the Linux process ID (optional, set when job starts).
  optional int32 pid = 3;
  // binary is the absolute path to the executable.
  string binary = 4;
  // args contains the command line arguments as executed.
  repeated string args = 5;
  // created_at is when the job was created.
  google.protobuf.Timestamp created_at = 6;
  // started_at is when the process started (optional).
  optional google.protobuf.Timestamp started_at = 7;
  // finished_at is when the process finished (optional).
  optional google.protobuf.Timestamp finished_at = 8;
  // Process termination details (available until server shutdown; job registry holds status until server death).
  // exit_code is set when process exited normally.
  optional int32 exit_code = 9;
  // signal is set when process was killed by signal.
  optional int32 signal = 10;
  // owner is the principal from mTLS client cert SAN.
  string owner = 11;
  // output_size is the current size of captured output in bytes.
  int64 output_size = 12;
  // truncated indicates if output was truncated due to size limits.
  bool truncated = 13;
  // termination_reason provides additional context for job termination.
  optional TerminationReason termination_reason = 14;
  // Errors communicated via gRPC status codes:
  // - NOT_FOUND: job ID does not exist
  // - PERMISSION_DENIED: job not owned by requesting principal
  // - UNAVAILABLE: server overloaded or shutting down
  // - INTERNAL: unexpected server error
}

message LogsRequest {
  string job_id = 1;
  // TODO: L5 - add offset support for resume/late joiners
  // int64 offset = 2;
}

message LogsResponse {
  bytes data = 1;
  // truncated indicates if this is the final chunk due to size limits.
  bool truncated = 2;
  // TODO: L5 - add offset support for resume/late joiners
  // int64 offset = 3;
  // Stream errors communicated via gRPC status codes:
  // - NOT_FOUND: job ID does not exist
  // - PERMISSION_DENIED: job not owned by requesting principal
  // - RESOURCE_EXHAUSTED: output size limits exceeded, job terminated
  // - UNAVAILABLE: server overloaded or shutting down
  // - INTERNAL: unexpected server error
}

// Job-level states rather than Linux process states (R/S/D/Z/T).
// Linux sleeping/waiting processes all appear as RUNNING to job clients.
// Clients care about job completion, not low-level process scheduling states.
enum JobStatus {
  // Zero value; should not be used in responses
  JOB_STATUS_UNSPECIFIED = 0;
  // Job created but process not yet started
  JOB_STATUS_PENDING = 1;
  // Process is actively running (includes Linux sleeping/waiting states)
  JOB_STATUS_RUNNING = 2;
  // Process is being gracefully terminated (SIGTERM sent, waiting for exit or timeout)
  JOB_STATUS_TERMINATING = 3;
  // Process exited with code 0 (success)
  JOB_STATUS_COMPLETED = 4;
  // Process exited with non-zero code or killed by signal
  JOB_STATUS_FAILED = 5;
  // Job was stopped by client request (SIGTERM -> SIGKILL lifecycle)
  JOB_STATUS_CANCELLED = 6;
}

// Provides additional context about why a job terminated
enum TerminationReason {
  TERMINATION_REASON_UNSPECIFIED = 0;
  // Process exited normally
  TERMINATION_REASON_EXITED = 1;
  // Process was killed by signal (not from stop request)
  TERMINATION_REASON_SIGNALED = 2;
  // Job stopped by client stop request
  TERMINATION_REASON_CLIENT_STOP = 3;
  // Job terminated due to server shutdown
  TERMINATION_REASON_SERVER_SHUTDOWN = 4;
  // Job terminated due to output size limit
  TERMINATION_REASON_OUTPUT_LIMIT = 5;
  // Job failed to start (binary not found, permission denied, etc.)
  TERMINATION_REASON_START_FAILED = 6;
}
