syntax = "proto3";

option go_package = "github.com/nombiezinja/teleport-ti-zhang-challenge-1/proto/k2so/v1;v1";

service K2SO {
  rpc StartProcess (StartProcessRequest) returns (StartProcessResponse);
  rpc StopProcess (StopProcessRequest) returns (StopProcessResponse);
  rpc GetProcessStatus (GetProcessStatusRequest) returns (GetProcessStatusResponse);
  rpc StreamProcessOutput (StreamProcessOutputRequest) returns (stream ProcessOutputChunk);
}

message StartProcessRequest {}
message StartProcessResponse {}
message StopProcessRequest {}
message StopProcessResponse {}
message GetProcessStatusRequest {}
message GetProcessStatusResponse {}
message StreamProcessOutputRequest {}
message ProcessOutputChunk {}

enum ProcessState {
  PROCESS_STATE_UNSPECIFIED = 0;
  PROCESS_STATE_RUNNING = 1;
  PROCESS_STATE_EXITED = 2;
  PROCESS_STATE_UNKNOWN = 3;
  PROCESS_STATE_TERMINATED = 4;
}
